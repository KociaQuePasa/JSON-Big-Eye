[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jbe"
version = "0.1.0"
description = "Explore huge JSON files as an interactive graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ijson>=3.2",
    "typer>=0.12",
    "rich>=13",
    "pywebview>=5.0",   # `jbe open` desktop window
    "fastapi>=0.110",   # `jbe serve` browser mode
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "orjson"]

[project.scripts]
jbe = "jbe.cli:app"

[tool.setuptools]
packages = ["jbe"]

[tool.setuptools.package-data]
jbe = ["static/*", "static/vendor/*"]
